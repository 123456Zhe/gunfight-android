# 待启用的 GitHub Actions CI：启用时执行
#   mkdir -p .github/workflows && git mv ci/github-actions-ci.yml .github/workflows/ci.yml
# （当前 gh token 缺 workflow scope，无法直接推送 .github/workflows/ 下的文件）
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  protocol-tests:
    name: protocol JVM tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install SDK packages
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0"
      - name: Protocol tests
        run: ./gradlew :protocol:test --no-daemon --stacktrace
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protocol-test-report
          path: protocol/build/reports/tests/test

  apk:
    name: debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install SDK packages
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0"
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gunfight-debug-apk
          path: app/build/outputs/apk/debug/*.apk
